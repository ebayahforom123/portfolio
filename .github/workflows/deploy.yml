name: Django CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    name: Django Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-dev zlib1g-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Django>=5.0,<5.1
        pip install Pillow python-decouple django-crispy-forms crispy-bootstrap5
        pip install django-cleanup django-resized whitenoise
        pip install markdown bleach
    
    - name: Create env file
      run: |
        echo "SECRET_KEY=test-key-12345" >> .env
        echo "DEBUG=True" >> .env
        echo "ALLOWED_HOSTS=*" >> .env
    
    - name: Run Django checks
      run: |
        python manage.py check
    
    - name: Check for migration issues
      run: |
        python manage.py makemigrations --check --dry-run 2>&1 || true
