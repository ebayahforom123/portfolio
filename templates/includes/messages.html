{% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm"
         role="alert">
        <div class="d-flex align-items-center">
            {% if message.tags == 'success' %}
                <i class="fas fa-check-circle me-2 fa-lg text-success"></i>
            {% elif message.tags == 'error' or message.tags == 'danger' %}
                <i class="fas fa-exclamation-circle me-2 fa-lg text-danger"></i>
            {% elif message.tags == 'warning' %}
                <i class="fas fa-exclamation-triangle me-2 fa-lg text-warning"></i>
            {% elif message.tags == 'info' %}
                <i class="fas fa-info-circle me-2 fa-lg text-info"></i>
            {% endif %}
            <div>{{ message }}</div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert"
                aria-label="Close"></button>
    </div>
    {% endfor %}
{% endif %}
